name: Build

# Minimal compile-check CI: configure and build SALMON (serial, no MPI) with
# gfortran on Ubuntu to catch Fortran compilation errors early on every push/PR.

# NOTE: the key is quoted as "on" on purpose. In YAML 1.1 (used by PyYAML and
# many linters) a bare `on:` is parsed as the boolean True ("Norway problem");
# GitHub's YAML 1.2 parser treats it as a string either way, so quoting keeps
# both happy.
"on":
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean previous build artifacts
        run: |
          rm -rf build/
          rm -rf ~/.cmake/

      - name: Install Toolchain (gfortran, cmake, lapack)
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake make liblapack-dev libblas-dev libopenblas-dev libopenblas-base

      - name: Verify LAPACK Installation
        run: |
          dpkg -l | grep -E "lapack|blas"
          pkg-config --list-all | grep -E "lapack|blas"

      - name: Configure SALMON (serial, no MPI)
        run: |
          cmake -B build -S . \
            -D CMAKE_BUILD_TYPE=Release \
            -D USE_MPI=OFF \
            -D CMAKE_Fortran_FLAGS="-fallow-argument-mismatch -fallow-invalid-boz" \
            -D CMAKE_C_FLAGS="-O2" \
            -D BLA_PREFER_STATIC_LIBS=ON

      - name: Build SALMON
        run: cmake --build build -j "$(nproc)"

      - name: Verify Build Execution
        run: |
          if [ -f "build/salmon" ]; then
            echo "SALMON binary successfully built!"
            ls -la build/salmon
          else
            echo "Error: SALMON binary compilation failed."
            exit 1
          fi
